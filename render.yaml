# Free plan: no persistent disk, so cloned repos vanish when the service restarts or spins down.
# Users just re-add a repo; nothing else is stored on the server. Upgrade and add a disk at /data if you want them to stick.
services:
  - type: web
    name: repo-agent
    runtime: docker
    plan: free
    envVars:
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_USERS
        sync: false
      - key: WORKSPACE_DIR
        value: /tmp/workspaces
